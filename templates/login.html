<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – ShikshaSetu</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="auth-body">
  <div class="auth-bg">
    <div class="auth-card">
      <div class="auth-logo"><span>🎓</span> ShikshaSetu</div>
      <h2>Welcome Back</h2>
      <p class="auth-sub">Please enter your details to sign in.</p>

      <div class="form-group">
        <label>I am a:</label>
        <select id="role">
          <option value="">Select your role</option>
          <option value="teacher">Teacher</option>
          <option value="student">Student</option>
        </select>
      </div>

      <div class="form-group">
        <label>Login ID / Email</label>
        <input type="text" id="email" placeholder="e.g. advik3890  or  teacher@email.com" autocomplete="username" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="pw-eye" onclick="togglePw('password', this)"
            aria-label="Toggle password visibility">👁</button>
        </div>
      </div>

      <div id="error-msg" class="error-msg" style="display:none"></div>
      <button class="btn-signin" onclick="doLogin()">Sign In →</button>
      <p class="auth-footer">Don't have an account? <a href="/signup">Sign Up</a></p>
    </div>
  </div>

  <script>
    function togglePw(inputId, btn) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
      btn.textContent = input.type === 'password' ? '👁' : '🙈';
    }

    async function doLogin() {
      const role = document.getElementById('role').value;
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('error-msg');
      err.style.display = 'none'; err.textContent = '';

      if (!role || !email || !password) {
        err.textContent = 'Please fill all fields.'; err.style.display = 'block'; return;
      }

      const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ role, email, password }) });
      const data = await res.json();
      if (data.success) {
        window.location.href = data.role === 'teacher' ? '/teacher' : '/student';
      } else {
        err.textContent = data.error || 'Login failed.'; err.style.display = 'block';
      }
    }
    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>

</html>
