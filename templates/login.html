<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – ShikshaSetu</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="auth-body">
  <div class="auth-bg">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p class="auth-sub">Please enter your details to login</p>

      <div class="form-group">
        <label>I am a:</label>
        <select id="role">
          <option value="">Select your role</option>
          <option value="teacher">Teacher</option>
          <option value="student">Student</option>
        </select>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>
      <div id="error-msg" class="error-msg"></div>
      <button class="btn-signin" onclick="doLogin()">Sign In</button>
      <p class="auth-footer">Don't have an account? <a href="/signup">Sign Up</a></p>
    </div>
  </div>
  <script>
    async function doLogin() {
      const role = document.getElementById('role').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const err = document.getElementById('error-msg');
      err.textContent = '';

      if (!role || !email || !password) {
        err.textContent = 'Please fill all fields.';
        return;
      }

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role, email, password })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = data.role === 'teacher' ? '/teacher' : '/student';
      } else {
        err.textContent = data.error || 'Login failed.';
      }
    }
    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>

</html>
