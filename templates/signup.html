<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up – ShikshaSetu</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
<div class="auth-bg">
  <div class="auth-card">
    <h2>Create Account</h2>
    <p class="auth-sub">Join ShikshaSetu today</p>

    <div class="form-group">
      <label>I am a:</label>
      <select id="role">
        <option value="">Select your role</option>
        <option value="teacher">Teacher</option>
        <option value="student">Student</option>
      </select>
    </div>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Your full name" />
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="name@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Create a password" />
    </div>
    <div id="error-msg" class="error-msg"></div>
    <div id="success-msg" class="success-msg"></div>
    <button class="btn-signin" onclick="doSignup()">Create Account</button>
    <p class="auth-footer">Already have an account? <a href="/login">Sign In</a></p>
  </div>
</div>
<script>
async function doSignup() {
  const role = document.getElementById('role').value;
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const err = document.getElementById('error-msg');
  const succ = document.getElementById('success-msg');
  err.textContent = ''; succ.textContent = '';

  if (!role || !name || !email || !password) {
    err.textContent = 'Please fill all fields.';
    return;
  }

  const res = await fetch('/api/signup', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({role, name, email, password})
  });
  const data = await res.json();
  if (data.success) {
    succ.textContent = 'Account created! Redirecting to login...';
    setTimeout(() => window.location.href = '/login', 1500);
  } else {
    err.textContent = data.error || 'Signup failed.';
  }
}
</script>
</body>
</html>
